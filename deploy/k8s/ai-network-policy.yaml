apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acemarketing-ai-default-deny
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [acemarketing-ai-worker, acemarketing-ml-service]
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acemarketing-ai-egress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [acemarketing-ai-worker, acemarketing-ml-service]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels: {app: acemarketing-ml-service}
      ports:
        - {protocol: TCP, port: 8000}
    - to:
        - podSelector:
            matchLabels: {app: postgres}
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 443}
# Standard Kubernetes NetworkPolicy cannot express provider FQDN allowlists.
# Production clusters should additionally restrict HTTPS egress with CNI/service-mesh
# FQDN policy to the configured OpenAI, Anthropic, Google, Voyage and artifact endpoints.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acemarketing-ml-internal-ingress
spec:
  podSelector:
    matchLabels: {app: acemarketing-ml-service}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: acemarketing-ai-worker}
        - podSelector:
            matchLabels: {app: acemarketing-api}
      ports:
        - {protocol: TCP, port: 8000}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: acemarketing-ai-config
data:
  NODE_ENV: production
  AI_LIVE_PROVIDER_CALLS: "false"
  AI_PROVIDER_TESTS_ENABLED: "false"
  AI_LIVE_VOICE_ENABLED: "false"
  WORKER_BATCH_SIZE: "10"
  WORKER_POLL_MS: "1000"
  WORKER_LEASE_MS: "60000"
  ML_ENV: production
  ML_ARTIFACT_DIR: /var/lib/acemarketing-ml/artifacts
  CHRONOS2_DEVICE: cpu
