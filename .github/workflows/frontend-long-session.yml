name: Frontend Long Session Soak

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Soak duration in minutes
        required: false
        default: '30'
  schedule:
    - cron: '40 1 * * 0'

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: acemarketing
          POSTGRES_USER: ace
          POSTGRES_PASSWORD: ace_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ace -d acemarketing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ace:ace_ci_password@127.0.0.1:5432/acemarketing
      DB_SSL: disable
      NODE_ENV: test
      AUTH_REQUIRED: "false"
      DEFAULT_WORKSPACE_ID: ws_default
      RATE_LIMIT_PER_MINUTE: "20000"
      CONNECTOR_ENCRYPTION_KEY: "ci-only-connector-encryption-key-not-for-production"
      FRONTEND_SOAK_MINUTES: ${{ github.event.inputs.minutes || '120' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run migrate
      - run: npx playwright install --with-deps chromium
      - name: Start API and run long-session soak
        shell: bash
        run: |
          npm run dev:backend > /tmp/ace-api.log 2>&1 &
          echo $! > /tmp/ace-api.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null; then break; fi
            sleep 1
          done
          npm run e2e:soak
          kill "$(cat /tmp/ace-api.pid)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-long-session-soak
          path: |
            playwright-report-soak
            test-results
          if-no-files-found: ignore
