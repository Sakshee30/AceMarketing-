name: Release Images

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize repository name
        id: repo
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build API image
        run: docker build -f deploy/Dockerfile.api -t ghcr.io/${{ steps.repo.outputs.name }}/api:${{ github.sha }} .
      - name: Build frontend image
        run: docker build -f deploy/Dockerfile.frontend -t ghcr.io/${{ steps.repo.outputs.name }}/web:${{ github.sha }} .
      - name: Push images
        run: |
          docker push ghcr.io/${{ steps.repo.outputs.name }}/api:${{ github.sha }}
          docker push ghcr.io/${{ steps.repo.outputs.name }}/web:${{ github.sha }}
