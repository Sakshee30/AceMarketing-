name: Release Images

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: acemarketing
          POSTGRES_USER: ace
          POSTGRES_PASSWORD: ace_release_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ace -d acemarketing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ace:ace_release_ci@127.0.0.1:5432/acemarketing
      DB_SSL: disable
      NODE_ENV: test
      AUTH_REQUIRED: "false"
      DEFAULT_WORKSPACE_ID: ws_release
      RATE_LIMIT_PER_MINUTE: "20000"
      CONNECTOR_ENCRYPTION_KEY: "release-ci-only-connector-encryption-key"
      PUBLIC_SITE_ORIGIN: https://acemarketing.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Node dependencies from lockfile
        run: npm ci
      - name: Apply migrations
        run: npm run migrate
      - name: Verify provider API version registry
        run: npm run provider:versions
      - name: Verify backend architecture, contracts, tenant isolation and foundation
        run: npm run backend:verify
      - name: Verify AI backend
        run: npm run verify:ai-backend
      - name: Verify all frontend release surfaces
        env:
          FRONTEND_BUDGET_MODE: strict
        run: npm run frontends:verify
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify base ML service
        run: |
          python -m pip install -e "ml-service[test]"
          ruff check ml-service/src ml-service/tests
          mypy --config-file ml-service/pyproject.toml ml-service/src/acemarketing_ml
          pytest -q ml-service/tests
      - name: Verify Docker-free systemd topology
        run: systemd-analyze verify deploy/systemd/*.service deploy/systemd/*.target

  images:
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repository name
        id: repo
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Initialize BuildKit builder
        run: docker buildx create --name ace-release --driver docker-container --use

      - name: Build and push API image with SBOM and provenance
        run: |
          docker buildx build             --platform linux/amd64             --file deploy/Dockerfile.api             --tag ghcr.io/${{ steps.repo.outputs.name }}/api:${{ github.sha }}             --sbom=true             --provenance=mode=max             --metadata-file api-metadata.json             --push .

      - name: Build and push control API image with SBOM and provenance
        run: |
          docker buildx build             --platform linux/amd64             --file deploy/Dockerfile.control-api             --tag ghcr.io/${{ steps.repo.outputs.name }}/control-api:${{ github.sha }}             --sbom=true             --provenance=mode=max             --metadata-file control-api-metadata.json             --push .

      - name: Build and push worker image with SBOM and provenance
        run: |
          docker buildx build             --platform linux/amd64             --file deploy/Dockerfile.worker             --tag ghcr.io/${{ steps.repo.outputs.name }}/worker:${{ github.sha }}             --sbom=true             --provenance=mode=max             --metadata-file worker-metadata.json             --push .

      - name: Build and push frontend image with SBOM and provenance
        run: |
          docker buildx build             --platform linux/amd64             --file deploy/Dockerfile.frontend             --tag ghcr.io/${{ steps.repo.outputs.name }}/web:${{ github.sha }}             --sbom=true             --provenance=mode=max             --metadata-file web-metadata.json             --push .

      - name: Build and push customer application image with SBOM and provenance
        run: |
          docker buildx build             --platform linux/amd64             --file deploy/Dockerfile.customer-app             --tag ghcr.io/${{ steps.repo.outputs.name }}/customer-app:${{ github.sha }}             --sbom=true             --provenance=mode=max             --metadata-file customer-app-metadata.json             --push .

      - name: Build and push public website image with SBOM and provenance
        run: |
          docker buildx build             --platform linux/amd64             --file deploy/Dockerfile.public-site             --tag ghcr.io/${{ steps.repo.outputs.name }}/public-site:${{ github.sha }}             --sbom=true             --provenance=mode=max             --metadata-file public-site-metadata.json             --push .

      - name: Build and push platform control frontend image with SBOM and provenance
        run: |
          docker buildx build             --platform linux/amd64             --file deploy/Dockerfile.platform-admin             --tag ghcr.io/${{ steps.repo.outputs.name }}/platform-admin:${{ github.sha }}             --sbom=true             --provenance=mode=max             --metadata-file platform-admin-metadata.json             --push .

      - name: Build and push base ML image with SBOM and provenance
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file deploy/Dockerfile.ml \
            --tag ghcr.io/${{ steps.repo.outputs.name }}/ml:${{ github.sha }} \
            --sbom=true \
            --provenance=mode=max \
            --metadata-file ml-metadata.json \
            --push .

      - name: Build and push forecasting ML image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file deploy/Dockerfile.ml-specialist \
            --build-arg ML_EXTRA=forecasting \
            --tag ghcr.io/${{ steps.repo.outputs.name }}/ml-forecast:${{ github.sha }} \
            --sbom=true \
            --provenance=mode=max \
            --metadata-file ml-forecast-metadata.json \
            --push .

      - name: Build and push causal ML image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file deploy/Dockerfile.ml-specialist \
            --build-arg ML_EXTRA=causal \
            --tag ghcr.io/${{ steps.repo.outputs.name }}/ml-causal:${{ github.sha }} \
            --sbom=true \
            --provenance=mode=max \
            --metadata-file ml-causal-metadata.json \
            --push .

      - name: Build and push MMM image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file deploy/Dockerfile.ml-specialist \
            --build-arg ML_EXTRA=mmm \
            --tag ghcr.io/${{ steps.repo.outputs.name }}/ml-mmm:${{ github.sha }} \
            --sbom=true \
            --provenance=mode=max \
            --metadata-file ml-mmm-metadata.json \
            --push .

      - name: Create immutable release manifest
        shell: bash
        run: |
          API_DIGEST=$(jq -r '."containerimage.digest"' api-metadata.json)
          CONTROL_DIGEST=$(jq -r '."containerimage.digest"' control-api-metadata.json)
          WORKER_DIGEST=$(jq -r '."containerimage.digest"' worker-metadata.json)
          WEB_DIGEST=$(jq -r '."containerimage.digest"' web-metadata.json)
          CUSTOMER_APP_DIGEST=$(jq -r '."containerimage.digest"' customer-app-metadata.json)
          PUBLIC_SITE_DIGEST=$(jq -r '."containerimage.digest"' public-site-metadata.json)
          PLATFORM_ADMIN_DIGEST=$(jq -r '."containerimage.digest"' platform-admin-metadata.json)
          ML_DIGEST=$(jq -r '."containerimage.digest"' ml-metadata.json)
          ML_FORECAST_DIGEST=$(jq -r '."containerimage.digest"' ml-forecast-metadata.json)
          ML_CAUSAL_DIGEST=$(jq -r '."containerimage.digest"' ml-causal-metadata.json)
          ML_MMM_DIGEST=$(jq -r '."containerimage.digest"' ml-mmm-metadata.json)
          MIGRATION_HEAD=$(find backend/migrations -maxdepth 1 -name '*.sql' -printf '%f\n' | sort | tail -n 1)
          cat > release-manifest.json <<EOF
          {
            "schemaVersion": "ace.release.v1",
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "repository": "${GITHUB_REPOSITORY}",
            "artifacts": {
              "api": "ghcr.io/${{ steps.repo.outputs.name }}/api@${API_DIGEST}",
              "controlApi": "ghcr.io/${{ steps.repo.outputs.name }}/control-api@${CONTROL_DIGEST}",
              "worker": "ghcr.io/${{ steps.repo.outputs.name }}/worker@${WORKER_DIGEST}",
              "web": "ghcr.io/${{ steps.repo.outputs.name }}/web@${WEB_DIGEST}",
              "customerApp": "ghcr.io/${{ steps.repo.outputs.name }}/customer-app@${CUSTOMER_APP_DIGEST}",
              "publicSite": "ghcr.io/${{ steps.repo.outputs.name }}/public-site@${PUBLIC_SITE_DIGEST}",
              "platformAdmin": "ghcr.io/${{ steps.repo.outputs.name }}/platform-admin@${PLATFORM_ADMIN_DIGEST}",
              "ml": "ghcr.io/${{ steps.repo.outputs.name }}/ml@${ML_DIGEST}",
              "mlForecast": "ghcr.io/${{ steps.repo.outputs.name }}/ml-forecast@${ML_FORECAST_DIGEST}",
              "mlCausal": "ghcr.io/${{ steps.repo.outputs.name }}/ml-causal@${ML_CAUSAL_DIGEST}",
              "mlMmm": "ghcr.io/${{ steps.repo.outputs.name }}/ml-mmm@${ML_MMM_DIGEST}"
            },
            "configurationVersion": "external-versioned-runtime-config",
            "supportedDeploymentModes": ["core","standard","full"],
            "databaseMigrationSource": "backend/migrations",
            "databaseMigrationHead": "${MIGRATION_HEAD}"
          }
          EOF
          cat release-manifest.json

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            release-manifest.json
            *-metadata.json
          if-no-files-found: error
