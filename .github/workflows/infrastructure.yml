name: Infrastructure Validation

on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infrastructure.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infrastructure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Show Terraform formatting diff
        run: |
          terraform fmt -recursive infra/terraform
          git diff --check
          git diff -- infra/terraform

      - name: Initialize staging without remote backend
        working-directory: infra/terraform/stacks/nonprod/staging
        run: terraform init -backend=false -input=false

      - name: Validate composed staging stack
        working-directory: infra/terraform/stacks/nonprod/staging
        run: terraform validate
