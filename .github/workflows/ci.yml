name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: acemarketing
          POSTGRES_USER: ace
          POSTGRES_PASSWORD: ace_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ace -d acemarketing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ace:ace_ci_password@127.0.0.1:5432/acemarketing
      DB_SSL: disable
      NODE_ENV: test
      AUTH_REQUIRED: "false"
      DEFAULT_WORKSPACE_ID: ws_default
      RATE_LIMIT_PER_MINUTE: "20000"
      CONNECTOR_ENCRYPTION_KEY: "ci-only-connector-encryption-key-not-for-production"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Prepare database schema for integration tests
        run: npm run migrate
      - name: Audit production dependencies
        run: npm run security:audit
      - name: Enforce frontend architecture boundaries
        run: npm run frontend:architecture
      - name: Enforce backend architecture boundaries
        run: npm run backend:architecture
      - name: Run backend foundation tests
        run: npm run test:backend-foundation
      - name: Validate frontend and backend
        run: npm run check:all
      - name: Run AI backend unit checks
        run: npm run test:ai-backend
      - name: Verify embedded local AI storage and retrieval path
        env:
          DATABASE_URL: ""
          NODE_ENV: test
        run: node --test backend/tests/ai-durable-jobs.test.mjs backend/tests/ai-knowledge-authorization.test.mjs

      - name: Run AI lifecycle script syntax checks
        run: npm run check:ai-tools
      - name: Build production frontend
        run: npm run build
      - name: Build standalone customer application
        run: npm run build:customer-app
      - name: Verify standalone customer application budget
        env:
          FRONTEND_BUDGET_MODE: report
        run: npm run frontend:budget:customer
      - name: Verify standalone customer application release assets
        run: npm run frontend:release:customer
      - name: Build standalone platform control application
        run: npm run build:platform-admin
      - name: Verify platform control budget
        env:
          FRONTEND_BUDGET_MODE: report
        run: npm run frontend:budget:control
      - name: Verify platform control release assets
        run: npm run frontend:release:control
      - name: Build standalone public website
        env:
          PUBLIC_SITE_ORIGIN: https://acemarketing.example.test
        run: npm run build:public-site
      - name: Verify standalone public website budget
        env:
          FRONTEND_BUDGET_MODE: report
        run: npm run frontend:budget:public
      - name: Verify standalone public website release assets
        run: npm run frontend:release:public
      - name: Verify optional workspace navigator remains lazy
        run: |
          grep -q "lazy(()=>import('./DashboardQuickNav'))" frontend/src/main.tsx
          grep -q "visibilitychange" frontend/src/DashboardQuickNav.tsx
      - name: Record frontend bundle budget evidence
        env:
          FRONTEND_BUDGET_MODE: report
        run: npm run frontend:budget
      - name: Verify frontend release asset integrity
        run: npm run frontend:release
      - name: Generate frontend release evidence
        run: npm run frontend:evidence
      - name: Upload frontend release evidence
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release-evidence
          path: artifacts/frontend-evidence
      - name: Run database migrations
        run: npm run migrate
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Boot API and run smoke tests
        shell: bash
        run: |
          npm run dev:backend > /tmp/ace-api.log 2>&1 &
          echo $! > /tmp/ace-api.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null; then break; fi
            sleep 1
          done
          npm run smoke
          npm run security:smoke
          npm run load:smoke
          npm run e2e
          npm run e2e:standalone
          npm run frontend:telemetry:check
          kill "$(cat /tmp/ace-api.pid)"
      - name: Build production containers
        run: |
          docker build -f deploy/Dockerfile.api -t ace-api:ci .
          docker build -f deploy/Dockerfile.frontend -t ace-web:ci .
          docker build -f deploy/Dockerfile.customer-app -t ace-customer-app:ci .
          docker build -f deploy/Dockerfile.public-site -t ace-public-site:ci .
          docker build -f deploy/Dockerfile.platform-admin -t ace-platform-admin:ci .
      - name: Verify canonical project structure
        run: |
          test -f frontend/src/AcePlatform.tsx
          test -f frontend/platform-admin/src/main.tsx
          test -f frontend/platform-admin/src/ControlCenterApp.tsx
          test -f frontend/platform-admin/src/features/manifest.ts
