name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: acemarketing
          POSTGRES_USER: ace
          POSTGRES_PASSWORD: ace_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ace -d acemarketing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ace:ace_ci_password@127.0.0.1:5432/acemarketing
      DB_SSL: disable
      NODE_ENV: test
      AUTH_REQUIRED: "false"
      DEFAULT_WORKSPACE_ID: ws_default
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate frontend and backend
        run: npm run check:all
      - name: Build production frontend
        run: npm run build
      - name: Run database migrations
        run: npm run migrate
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Boot API and run smoke tests
        shell: bash
        run: |
          npm run dev:backend > /tmp/ace-api.log 2>&1 &
          echo $! > /tmp/ace-api.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null; then break; fi
            sleep 1
          done
          npm run smoke
          npm run security:smoke
          npm run load:smoke
          npm run e2e
          kill "$(cat /tmp/ace-api.pid)"
      - name: Build production containers
        run: |
          docker build -f deploy/Dockerfile.api -t ace-api:ci .
          docker build -f deploy/Dockerfile.frontend -t ace-web:ci .
      - name: Verify canonical project structure
        run: |
          test -f frontend/src/AcePlatform.tsx
          test -f frontend/src/lib/api.ts
          test -f backend/src/index.mjs
          test -f backend/src/security.mjs
          test -f backend/src/store.mjs
          test -f backend/src/vault.mjs
          test -f backend/src/queue.mjs
          test -f backend/src/providers.mjs
          test -f backend/src/worker.mjs
          test -f backend/src/attribution-store.mjs
          test -f backend/src/lead-ops.mjs
          test -f backend/src/activation-adapters.mjs
          test -f backend/src/connector-auth.mjs
          test -f backend/src/agent-orchestrator.mjs
          test -f backend/src/custom-integrations.mjs
          test -f backend/src/observability.mjs
          test -f backend/src/entitlements.mjs
          test -f backend/src/billing-provider.mjs
          test -f backend/src/consent.mjs
          test -f backend/src/privacy-ops.mjs
          test -f backend/src/audience-scheduler.mjs
          test -f backend/src/cohort-analytics.mjs
          test -f backend/src/event-rules.mjs
          test -f backend/src/report-scheduler.mjs
          test -f backend/src/whatsapp-cloud.mjs
          test -f backend/src/call-events.mjs
          test -f backend/src/calendar-provider.mjs
          test -f backend/migrations/016_meeting_calendar.sql
          test -f backend/scripts/privacy-retention.mjs
          test -f backend/scripts/migrate.mjs
          test -f backend/migrations/001_workspace_state.sql
          test -f backend/migrations/002_job_queue.sql
          test -f backend/migrations/003_attribution_identity.sql
          test -f backend/migrations/004_lead_ops.sql
          test -f backend/migrations/005_activation_receipts.sql
          test -f backend/migrations/006_agent_orchestration.sql
          test -f backend/migrations/007_custom_integrations.sql
          test -f backend/migrations/008_observability_usage.sql
          test -f backend/migrations/009_entitlements.sql
          test -f backend/migrations/010_billing_provider.sql
          test -f backend/migrations/011_consent.sql
          test -f backend/migrations/012_privacy_ops.sql
          test -f backend/migrations/013_audience_scheduler.sql
          test -f backend/migrations/014_event_rules.sql
          test -f backend/migrations/015_report_scheduler.sql
          test -f backend/scripts/preflight.mjs
          test -f backend/scripts/smoke.mjs
          test -f backend/scripts/backup.mjs
          test -f backend/scripts/restore.mjs
          test -f backend/scripts/security-smoke.mjs
          test -f backend/scripts/load-smoke.mjs
          test -f deploy/Dockerfile.api
          test -f deploy/Dockerfile.frontend
          test -f deploy/nginx.conf
          test -f docker-compose.yml
          test -f docs/PRODUCTION_RUNBOOK.md
          test -f playwright.config.ts
          test -f tests/e2e/platform.spec.ts
