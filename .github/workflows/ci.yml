name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: acemarketing
          POSTGRES_USER: ace
          POSTGRES_PASSWORD: ace_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ace -d acemarketing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ace:ace_ci_password@127.0.0.1:5432/acemarketing
      DB_SSL: disable
      NODE_ENV: test
      AUTH_REQUIRED: "false"
      DEFAULT_WORKSPACE_ID: ws_default
      RATE_LIMIT_PER_MINUTE: "20000"
      CONNECTOR_ENCRYPTION_KEY: "ci-only-connector-encryption-key-not-for-production"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: npm run security:audit
      - name: Enforce frontend architecture boundaries
        run: npm run frontend:architecture
      - name: Validate frontend and backend
        run: npm run check:all
      - name: Build production frontend
        run: npm run build
      - name: Verify optional workspace navigator remains lazy
        run: |
          grep -q "lazy(()=>import('./DashboardQuickNav'))" frontend/src/main.tsx
          grep -q "visibilitychange" frontend/src/DashboardQuickNav.tsx
      - name: Record frontend bundle budget evidence
        env:
          FRONTEND_BUDGET_MODE: report
        run: npm run frontend:budget
      - name: Verify frontend release asset integrity
        run: npm run frontend:release
      - name: Run database migrations
        run: npm run migrate
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Boot API and run smoke tests
        shell: bash
        run: |
          npm run dev:backend > /tmp/ace-api.log 2>&1 &
          echo $! > /tmp/ace-api.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null; then break; fi
            sleep 1
          done
          npm run smoke
          npm run security:smoke
          npm run load:smoke
          npm run e2e
          kill "$(cat /tmp/ace-api.pid)"
      - name: Build production containers
        run: |
          docker build -f deploy/Dockerfile.api -t ace-api:ci .
          docker build -f deploy/Dockerfile.frontend -t ace-web:ci .
      - name: Verify canonical project structure
        run: |
          test -f frontend/src/AcePlatform.tsx
          test -f frontend/src/lib/api.ts
          test -f frontend/src/lib/runtime-config.ts
          test -f frontend/src/lib/mutation-lifecycle.ts
          test -f frontend/src/lib/dirty-work.ts
          test -f frontend/src/components/system/FrontendFoundation.tsx
          test -f frontend/src/components/system/FrontendStates.tsx
          test -f frontend/src/components/system/AccessibleDialog.tsx
          test -f frontend/src/components/system/ConnectionStatus.tsx
          test -f frontend/src/components/system/ChunkRecoveryNotice.tsx
          test -f frontend/src/features/workspace/manifest.ts
          test -f frontend/src/features/settings/components/BillingUsageSettings.tsx
          test -f frontend/src/features/settings/components/GovernanceSettings.tsx
          test -f frontend/src/features/settings/components/UsersRolesSettings.tsx
          test -f frontend/src/features/settings/ui/SettingsPrimitives.tsx
          test -f frontend/src/features/settings/data/settings.api.ts
          test -f frontend/src/features/settings/pages/SettingsPage.tsx
          test -f frontend/src/features/settings/public.ts
