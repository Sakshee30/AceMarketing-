name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate frontend and backend
        run: npm run check:all
      - name: Build production frontend
        run: npm run build
      - name: Verify canonical project structure
        run: |
          test -f frontend/src/AcePlatform.tsx
          test -f frontend/src/lib/api.ts
          test -f backend/src/index.mjs
          test -f backend/src/security.mjs
          test -f backend/src/store.mjs
          test -f backend/src/vault.mjs
          test -f backend/scripts/migrate.mjs
          test -f backend/migrations/001_workspace_state.sql
