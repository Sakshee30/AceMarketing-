name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate frontend and backend
        run: npm run check:all
      - name: Build production frontend
        run: npm run build
      - name: Verify canonical project structure
        run: |
          test -f frontend/src/AcePlatform.tsx
          test -f frontend/src/lib/api.ts
          test -f backend/src/index.mjs
          test -f backend/src/security.mjs
          test -f backend/src/store.mjs
          test -f backend/src/vault.mjs
          test -f backend/src/queue.mjs
          test -f backend/src/providers.mjs
          test -f backend/src/worker.mjs
          test -f backend/src/attribution-store.mjs
          test -f backend/src/lead-ops.mjs
          test -f backend/src/activation-adapters.mjs
          test -f backend/src/agent-orchestrator.mjs
          test -f backend/src/custom-integrations.mjs
          test -f backend/src/observability.mjs
          test -f backend/src/entitlements.mjs
          test -f backend/src/billing-provider.mjs
          test -f backend/scripts/migrate.mjs
          test -f backend/migrations/001_workspace_state.sql
          test -f backend/migrations/002_job_queue.sql
          test -f backend/migrations/003_attribution_identity.sql
          test -f backend/migrations/004_lead_ops.sql
          test -f backend/migrations/005_activation_receipts.sql
          test -f backend/migrations/006_agent_orchestration.sql
          test -f backend/migrations/007_custom_integrations.sql
          test -f backend/migrations/008_observability_usage.sql
          test -f backend/migrations/009_entitlements.sql
          test -f backend/migrations/010_billing_provider.sql
