name: One-shot ML formatter

on:
  push:
    branches: [fix/ml-format-and-verification]

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[ml-format]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ml-format-and-verification
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff==0.16.9"
      - name: Apply Ruff formatter
        run: ruff format ml-service/src ml-service/tests
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ml-service/src ml-service/tests
          git commit -m "[ml-format] Apply Ruff formatting"
          git push origin HEAD:fix/ml-format-and-verification
