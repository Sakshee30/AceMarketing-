name: Pre-live Qualification
on:
  push:
    branches: ['qa/prelive-qualification-20261003']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prelive-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.source.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
      - name: Materialize reviewed implementation and commit source repairs on QA branch only
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'qa/prelive-qualification-20261003'
          if test -f qa-transport/part0.b64; then
            python3 - <<'PY'
          import base64,gzip,hashlib,io,json,lzma,pathlib
          root=pathlib.Path.cwd()
          encoded=''.join((root/f'qa-transport/part{i}.b64').read_text() for i in range(3))
          payload=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(payload).hexdigest()=='4a10b9d9a3d81a666b7855d720cb92c28ba4fdd7be7837ea6a8f226821337978'
          files=json.loads(lzma.decompress(payload))
          for name,item in files.items():
              relative=pathlib.PurePosixPath(name)
              assert not relative.is_absolute() and '..' not in relative.parts
              assert name.startswith('qa/') or name=='backend/src/security.mjs',name
              path=root/name
              raw=item['text'].encode()
              if item['encoding']=='gzip-on-write':
                  path=path.with_name(path.name+'.gz')
                  stream=io.BytesIO()
                  with gzip.GzipFile(fileobj=stream,mode='wb',mtime=0) as out:out.write(raw)
                  raw=stream.getvalue()
              else:assert item['encoding']=='utf-8'
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(raw)
          repairs=json.loads((root/'qa/source-repairs.json').read_text())
          assert set(repairs)=={'backend/src/connector-ingestion.mjs','backend/src/index.mjs','backend/src/worker.mjs'}
          for name,pairs in repairs.items():
              p=root/name;s=p.read_text()
              for old,new in pairs:
                  assert s.count(old)==1,(name,'source drift')
                  s=s.replace(old,new)
              p.write_text(s)
          (root/'qa/source-repairs.json').unlink()
          with (root/'.gitignore').open('a') as f:f.write('\n# Qualification reports are not source\nartifacts/prelive/\nqa/__pycache__/\n')
          PY
            git rm qa-transport/part0.b64 qa-transport/part1.b64 qa-transport/part2.b64
            git add qa backend/src/security.mjs backend/src/connector-ingestion.mjs backend/src/index.mjs backend/src/worker.mjs .gitignore
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test(qa): implement isolated PostgreSQL/API/browser qualification and fix runtime/auth defects'
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  qualification:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install test browsers and PostgreSQL server tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16
          npx playwright install --with-deps chromium firefox webkit
      - name: Freeze candidate evidence
        run: |
          mkdir -p artifacts/prelive
          git rev-parse HEAD > artifacts/prelive/candidate.txt
          node --version > artifacts/prelive/node-version.txt
          git archive --format=tar.gz --output=artifacts/prelive/tested-source.tar.gz HEAD
      - name: Execute actual isolated qualification
        run: bash qa/run-isolated.sh
      - name: Preserve test reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prelive-evidence-${{ needs.prepare.outputs.candidate }}
          path: artifacts/prelive/
          if-no-files-found: error
          retention-days: 14
