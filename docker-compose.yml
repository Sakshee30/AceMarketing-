services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acemarketing}
      POSTGRES_USER: ${POSTGRES_USER:-ace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-ace} -d ${POSTGRES_DB:-acemarketing}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ace_internal]

  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ace}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-acemarketing}
      DB_SSL: disable
    command: ["node","backend/scripts/migrate.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ace_internal]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ace}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-acemarketing}
      PORT: 3001
      NODE_ENV: production
      ALLOW_FILE_STORE_IN_PRODUCTION: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [ace_internal]
    expose: ["3001"]


  control-api:
    profiles: ["control"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.control-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ace}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-acemarketing}
      NODE_ENV: production
      CONTROL_PORT: 3002
      CONTROL_ADMIN_EMAIL: ${CONTROL_ADMIN_EMAIL:-}
      CONTROL_ADMIN_PASSWORD_HASH: ${CONTROL_ADMIN_PASSWORD_HASH:-}
      CONTROL_SESSION_SECRET: ${CONTROL_SESSION_SECRET:-}
      ACE_RELEASE_SHA: ${ACE_RELEASE_SHA:-}
      ACE_CONFIG_VERSION: ${ACE_CONFIG_VERSION:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [ace_internal]
    expose: ["3002"]

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ace}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-acemarketing}
      NODE_ENV: production
      ALLOW_FILE_STORE_IN_PRODUCTION: "false"
    command: ["node","backend/src/worker.mjs"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [ace_internal]

  ml-service:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.ml
    restart: unless-stopped
    environment:
      ML_ENV: production
      ML_SERVICE_AUTH_TOKEN: ${ML_SERVICE_AUTH_TOKEN:-}
      ML_ARTIFACT_DIR: /var/lib/acemarketing-ml/artifacts
      ML_ARTIFACT_S3_BUCKET: ${ML_ARTIFACT_S3_BUCKET:-}
    volumes:
      - ml_artifacts:/var/lib/acemarketing-ml/artifacts
    networks: [ace_internal]
    expose: ["8000"]

  ml-forecasting:
    profiles: ["ai-forecasting"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.ml-specialist
      args:
        ML_EXTRA: forecasting
    restart: unless-stopped
    environment:
      ML_ENV: production
      ML_SERVICE_AUTH_TOKEN: ${ML_FORECAST_SERVICE_AUTH_TOKEN:-${ML_SERVICE_AUTH_TOKEN:-}}
      ML_ARTIFACT_DIR: /var/lib/acemarketing-ml/artifacts
      ML_ARTIFACT_S3_BUCKET: ${ML_ARTIFACT_S3_BUCKET:-}
      ML_ARTIFACT_S3_PREFIX: ${ML_ARTIFACT_S3_PREFIX:-acemarketing/ml-artifacts}
      ML_ARTIFACT_S3_ENDPOINT: ${ML_ARTIFACT_S3_ENDPOINT:-}
      ML_ARTIFACT_S3_REGION: ${ML_ARTIFACT_S3_REGION:-}
      CHRONOS2_REVISION: ${CHRONOS2_REVISION:-}
      CHRONOS2_SNAPSHOT_DIR: ${CHRONOS2_SNAPSHOT_DIR:-}
      CHRONOS2_EXPECTED_SHA256: ${CHRONOS2_EXPECTED_SHA256:-}
      CHRONOS2_ALLOW_DOWNLOAD: ${CHRONOS2_ALLOW_DOWNLOAD:-false}
      CHRONOS2_DEVICE: ${CHRONOS2_DEVICE:-cpu}
    volumes:
      - ml_artifacts:/var/lib/acemarketing-ml/artifacts
    networks: [ace_internal]
    expose: ["8000"]

  ml-causal:
    profiles: ["ai-causal"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.ml-specialist
      args:
        ML_EXTRA: causal
    restart: unless-stopped
    environment:
      ML_ENV: production
      ML_SERVICE_AUTH_TOKEN: ${ML_CAUSAL_SERVICE_AUTH_TOKEN:-${ML_SERVICE_AUTH_TOKEN:-}}
      ML_ARTIFACT_DIR: /var/lib/acemarketing-ml/artifacts
      ML_ARTIFACT_S3_BUCKET: ${ML_ARTIFACT_S3_BUCKET:-}
      ML_ARTIFACT_S3_PREFIX: ${ML_ARTIFACT_S3_PREFIX:-acemarketing/ml-artifacts}
      ML_ARTIFACT_S3_ENDPOINT: ${ML_ARTIFACT_S3_ENDPOINT:-}
      ML_ARTIFACT_S3_REGION: ${ML_ARTIFACT_S3_REGION:-}
    volumes:
      - ml_artifacts:/var/lib/acemarketing-ml/artifacts
    networks: [ace_internal]
    expose: ["8000"]

  ml-mmm:
    profiles: ["ai-mmm"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.ml-specialist
      args:
        ML_EXTRA: mmm
    restart: unless-stopped
    environment:
      ML_ENV: production
      ML_SERVICE_AUTH_TOKEN: ${ML_MMM_SERVICE_AUTH_TOKEN:-${ML_SERVICE_AUTH_TOKEN:-}}
      ML_ARTIFACT_DIR: /var/lib/acemarketing-ml/artifacts
      ML_ARTIFACT_S3_BUCKET: ${ML_ARTIFACT_S3_BUCKET:-}
      ML_ARTIFACT_S3_PREFIX: ${ML_ARTIFACT_S3_PREFIX:-acemarketing/ml-artifacts}
      ML_ARTIFACT_S3_ENDPOINT: ${ML_ARTIFACT_S3_ENDPOINT:-}
      ML_ARTIFACT_S3_REGION: ${ML_ARTIFACT_S3_REGION:-}
    volumes:
      - ml_artifacts:/var/lib/acemarketing-ml/artifacts
    networks: [ace_internal]
    expose: ["8000"]


  platform-admin:
    profiles: ["control"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.platform-admin
    restart: unless-stopped
    depends_on:
      control-api:
        condition: service_healthy
    ports:
      - "${ACE_CONTROL_HTTP_PORT:-8081}:80"
    networks: [ace_internal]

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ACE_HTTP_PORT:-8080}:80"
    networks: [ace_internal]

volumes:
  postgres_data:
  ml_artifacts:

networks:
  ace_internal:
    driver: bridge
