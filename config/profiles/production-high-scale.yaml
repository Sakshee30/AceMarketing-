schemaVersion: 2
profile: production-high-scale
implementationStatus: qualification-target
capacity:
  registeredUsersTarget: 700000
  dynamicRpsQualificationTarget: 50000
  simultaneousActiveSessionsScenario: 70000
  claimStatus: qualification-required
currentRuntime:
  database:
    provider: postgres
    authoritative: true
  queue:
    provider: postgres
    durability: durable
    delivery: at-least-once
    requiredForAcceptedJobs: true
    onUnavailable: reject-new-admission
  objectStorage:
    provider: s3-compatible
    requiredWhenFeature: files
    onUnavailable: reject-upload-safely
  cache:
    provider: none
    redisAdapterContractAvailable: true
  search:
    provider: postgres-limited
  tenantCells:
    available: true
scaleOutTargets:
  cache:
    candidate: redis
    status: adapter-contract-only
    qualificationRequired: true
  queueAcceleration:
    candidate: external-durable-queue
    status: not-selected
    note: PostgreSQL remains durable intent authority until an external dispatch adapter is implemented and qualified.
  analytics:
    candidate:
      - clickhouse
      - bigquery
      - snowflake
    status: not-selected
    qualificationRequired: true
  search:
    candidate: opensearch
    status: deferred
    fallback: postgres-limited
  tenantCells:
    enabled: true
    requireRoutingEpoch: true
    singleWriter: true
security:
  authentication: required
  authorization: required
  tenantIsolation: required
  secretProvider: externally-injected
qualificationRequired:
  - representative load and tenant skew
  - provider quotas
  - cache-loss fallback budget
  - database saturation and failover
  - zone failure
  - recovery RPO/RTO
  - external queue semantics if introduced
  - analytics warehouse reconciliation if introduced
